<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scraper</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    label, input, button {
      font-size: 1rem;
      margin-right: 0.5rem;
    }
    #results {
      margin-top: 1rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <p><a href="https://github.com/bip32JP/bip32JP.github.io" target="_blank">Check out GitHub for the proxy script</a></p>
  <label for="limit">How many recent entries:</label>
  <input type="number" id="limit" value="1" min="1" max="100" /><br>
  Auto-open latest: <input type="checkbox" id="autoopen" /><br>
  <label for="proxymode">Proxy:</label>
  <select id="proxymode">
    <option value="corsproxy" selected>corsproxy.io</option>
    <option value="custom">Custom proxy origin</option>
  </select><br>
  <div id="corsproxyRow">
    <label for="apikey"><a href="https://console.corsproxy.io/" target="_blank">CORSproxy.io</a> API key:</label>
    <input type="password" id="apikey" />
  </div>
  <div id="customRow" style="display:none">
    <label for="proxyorigin">Proxy origin (e.g. from cors_proxy.py in this same repository):</label>
    <input type="text" id="proxyorigin" value="http://localhost:8080" />
  </div>
  <button id="fetchButton">Fetch</button><br>

  <div id="results"></div>

  <script>
    const BASE_URL = atob('aHR0cHM6Ly93d3cua2FucG8uZ28uanA=');
    const KEYWORD = '\u5e30\u5316';

    const CPRX = atob('aHR0cHM6Ly9jb3JzcHJveHkuaW8vPw==');

    const proxymode = document.getElementById('proxymode');
    proxymode.addEventListener('change', () => {
      const custom = proxymode.value === 'custom';
      document.getElementById('corsproxyRow').style.display = custom ? 'none' : '';
      document.getElementById('customRow').style.display = custom ? '' : 'none';
    });

    const proxify = (url) => {
      if (proxymode.value === 'custom') {
        const origin = document.getElementById('proxyorigin').value.trim().replace(/\/+$/, '');
        return `${origin}/?url=${encodeURIComponent(url)}`;
      }
      const apiKey = document.getElementById('apikey').value.trim();
      return `${CPRX}key=${encodeURIComponent(apiKey)}&url=${encodeURIComponent(url)}`;
    };

    const fetchHTML = async (url) => {
      const res = await fetch(proxify(url));
      const text = await res.text();
      return new DOMParser().parseFromString(text, 'text/html');
    };

    async function getLatestUrls(limit) {
      const doc = await fetchHTML(BASE_URL);
      const anchors = doc.querySelectorAll('dl dt a');
      const urls = [];

      for (let i = 0; i < Math.min(limit, anchors.length); i++) {
        const href = anchors[i].getAttribute('href');
        if (href && !href.includes('//')) {
          urls.push(new URL(href, BASE_URL).href);
        }
      }

      return urls;
    }

    async function findEntry(url) {
      const doc = await fetchHTML(url);
      const anchors = doc.querySelectorAll('a');

      for (const a of anchors) {
        if (a.textContent.includes(KEYWORD)) {
          const href = a.getAttribute('href');
          if (href) {
            return new URL(href, url).href;
          }
        }
      }

      return null;
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetchData() {
      const results = document.getElementById('results');
      if (proxymode.value === 'corsproxy' && !document.getElementById('apikey').value.trim()) {
        results.textContent = 'Please enter your CORSproxy.io API key.';
        return;
      }
      if (proxymode.value === 'custom' && !document.getElementById('proxyorigin').value.trim()) {
        results.textContent = 'Please enter your proxy origin (e.g. http://localhost:8080).';
        return;
      }
      const limit = parseInt(document.getElementById('limit').value);
      const autoOpen = document.getElementById('autoopen').checked;
      results.textContent = 'Loading...';

      const urls = await getLatestUrls(limit);
      const length = urls.length;
      let current = 0;

      const printStatus = () => {
        results.textContent = `Loading... ${current}/${length}`;
      }
      const matchPromises = [];
      for (const url of urls) {
        matchPromises.push(findEntry(url).then(match => {
            current++;
            printStatus();
            return { url, match }
        }));
        await delay(100); // 100ms delay between requests
      }
      const checks = await Promise.all(matchPromises);

      const lines = [];
      let firstMatch = null;

      for (const [i, { url, match }] of checks.entries()) {
        if (match) {
          lines.push(`<a href="${url}" target="_blank">${url}</a> → <a href="${match}" target="_blank">${match}</a><br><br>`);
          if (i === 0) firstMatch = match;
        } else {
          lines.push(`<a href="${url}" target="_blank">${url}</a> → No Entry<br><br>`);
        }
      }

      results.innerHTML = lines.join('\n');

      if (firstMatch && autoOpen) {
        window.open(firstMatch, '_blank');
      }
    }

    document.getElementById('fetchButton').addEventListener('click', fetchData);
  </script>
</body>
</html>
